name: JustitiaAI CI & AI Code Evaluator

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-ai-evaluation:
    name: Lint, Test, & LLM-as-a-Judge Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Static Code Quality Lint (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Strict Type Verification (Mypy)
        run: |
          cd backend
          mypy app/

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v tests/ --cov=app --cov-report=term-missing

      - name: Execute RAG Triad Benchmark Evaluator
        run: |
          cd backend
          python -m evaluation.eval_rag_triad

      - name: Execute Legal Ethics & UPL Guardrail Evaluator
        run: |
          cd backend
          python -m evaluation.eval_legal_ethics
